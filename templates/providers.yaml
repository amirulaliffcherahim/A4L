# A4L Providers Configuration
# Base ships ONE provider: OpenAI-compatible Chat Completions
default_provider: openai-compatible

providers:
  openai-compatible:
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    default_model: "gpt-4o"
    extra_headers: {}
    quirks:
      stream_usage: true
      use_max_completion_tokens: true
      estimate_tokens_if_missing: true

  # Example local Ollama / vLLM / llama.cpp endpoint:
  # local-server:
  #   base_url: "http://127.0.0.1:11434/v1"
