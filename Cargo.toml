[workspace]
resolver = "2"
members = [
    "crates/a4l-policy",
    "crates/a4l-core",
    "crates/a4l-cli",
    "crates/a4l-ext-api",
    "crates/a4l-ext",
    "crates/a4l-mcp",
    "crates/a4l-server",
    "crates/a4l-pty",
    "crates/a4l-memory",
    "crates/a4l-desktop",
    "crates/a4l-ext-anthropic",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["A4L Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/amirulaliffcherahim/A4L"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
tokio = { version = "1.40", features = ["full"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
glob = "0.3"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1"
futures = "0.3"
tempfile = "3.17"
fs2 = "0.4"
colored = "2.2"
rusqlite = { version = "0.31", features = ["bundled"] }
